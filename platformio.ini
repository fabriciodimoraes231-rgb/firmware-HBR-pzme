[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DMQTT_MAX_PACKET_SIZE=1536
lib_deps = 
    mandulaj/PZEM-004T-v30
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    adafruit/Adafruit AHTX0



